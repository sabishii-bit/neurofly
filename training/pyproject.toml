[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofly-training"
version = "0.1.0"
description = "Builds and trains fly-brain controllers (connectome loading, body and PC environments, PPO / ES / imitation) and exports them as artifacts for neurofly-core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neurofly-core",
    "numpy==1.26.4",          # pinned by flybody
    "pandas",
    "pyarrow",
    "requests",
    "tqdm",
    "gymnasium",
    "stable-baselines3>=2.3",
    "tensorboard",
    "imageio",
    "imageio-ffmpeg",
    "trimesh",                # export-body: the fly as glTF
    "websockets",             # watch --pose-ws: live poses for the viewer
    "neuprint-python",        # optional live queries against neuprint.janelia.org
]

[project.optional-dependencies]
# the MuJoCo fly body (not on PyPI); locally an editable checkout next door is used
flybody = [
    "flybody @ git+https://github.com/TuragaLab/flybody.git",
    "h5py",                   # its walking imitation dataset (body-replay --real)
]
# reading numbers off the screen for reward (also needs a Tesseract install)
ocr = ["pytesseract"]
# object detectors: open-vocabulary (transformers), fine-tuning (torchvision), ONNX export
detect = ["transformers", "torchvision", "onnx", "onnxruntime"]
# the Ultralytics backends (YOLO11, YOLO-World); AGPL-3.0, like this project
yolo = ["ultralytics", "clip @ git+https://github.com/ultralytics/CLIP.git"]
# tests, lint, and regenerating the gRPC stubs
dev = ["pytest", "pytest-cov", "ruff", "grpcio-tools"]

[project.scripts]
neurofly = "neurofly_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neurofly_training*"]
