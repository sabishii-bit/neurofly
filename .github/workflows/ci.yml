# Lint, the Python suite (with the MuJoCo body and the Node client), the committed atlas's
# hashes, and the Rust and Go bindings, on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUJOCO_GL: egl            # headless rendering for the body tests
      PYOPENGL_PLATFORM: egl
      YOLO_AUTOINSTALL: "False"
      PYNPUT_BACKEND_KEYBOARD: dummy   # no display on the runner
      PYNPUT_BACKEND_MOUSE: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            training/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"        # a global WebSocket for the Node tests
      - name: Headless OpenGL for MuJoCo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libglx-mesa0 libosmesa6 ffmpeg libportaudio2 libpulse0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e core[pc,ws,video] -e training[dev,flybody,detect]
          pip install --force-reinstall --no-deps numpy==1.26.4
      - name: Lint
        run: ruff check --select E,F,W --line-length 100 --exclude "*_pb2*" tests core/src training/src scripts
      - name: The committed atlas matches its manifest
        run: neurofly export-atlas --out assets/brain-atlas --check
      - name: Build the Node package (its tests run from pytest)
        working-directory: bindings/node
        run: npm install --no-audit --no-fund && npm run build   # no lockfile is committed
      - name: Tests
        run: python -m pytest -q --no-header -p no:cacheprovider

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: bindings/rust
        run: cargo build --all-targets

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: bindings/go
        run: go build ./... && go vet ./...
