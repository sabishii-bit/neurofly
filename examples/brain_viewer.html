<!doctype html>
<!--
  The brain as a point cloud, lit up by its own spikes. Every neuron is a point at its
  soma; a spike flashes it and the light fades over a few frames, so activity can be seen
  travelling across the brain. With an artifact directory served alongside, the strongest
  synapses are drawn as lines that flash when their presynaptic neuron fires.

  Three ways to feed it:

    # a file: every step's spikes with the positions, from any of these
    neurofly-core run artifacts/myapp --window "My App" --activity-out activity.json
    neurofly play --window "My App" --run runs/x --activity-out activity.json
    neurofly watch runs/x --activity-out activity.json          # PC or body runs
    python -m http.server 8000     # from the repository root, then open
    http://localhost:8000/examples/brain_viewer.html?activity=../activity.json

    # live, while the fly plays: the same commands with --activity-ws 127.0.0.1:8767
    http://localhost:8000/examples/brain_viewer.html?ws=ws://127.0.0.1:8767

    # live, from a served brain that another program is driving (Node, Rust, Go, ...)
    neurofly-core serve artifacts/myapp --ws 127.0.0.1:8765
    http://localhost:8000/examples/brain_viewer.html?ws=ws://127.0.0.1:8765&subscribe=1

  Add &artifact=../artifacts/myapp to draw synapses (the page reads brain/*.bin and
  manifest.json over HTTP), &edges=2 for how many outgoing synapses per neuron (0 = none),
  &decay=0.85 for how fast the glow fades per frame, &size=2.2 for the point size.

  Positions are soma positions from the MaleCNS annotations in micrometres; neurons whose
  soma lies outside the volume (sensory neurons) are placed near their annotated group and
  drawn dimmer. Colours are by superclass. Drag to orbit, scroll to zoom.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>neurofly brain</title>
  <style>
    body { margin: 0; background: #08090c; color: #ccd; font: 13px system-ui, sans-serif; }
    #hud { position: fixed; left: 12px; top: 10px; line-height: 1.5; pointer-events: none; }
    #legend { position: fixed; right: 12px; top: 10px; line-height: 1.4; }
    #legend span { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 5px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="hud">loading...</div>
  <div id="legend"></div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const params = new URLSearchParams(location.search);
    const activityUrl = params.get("activity");
    const wsUrl = params.get("ws");
    const artifactUrl = params.get("artifact");
    const edgesPerNeuron = parseInt(params.get("edges") ?? "2");
    const decay = parseFloat(params.get("decay") ?? "0.85");
    const subscribe = params.get("subscribe") === "1";
    const hud = document.getElementById("hud");
    const legend = document.getElementById("legend");

    // --- colours by superclass ------------------------------------------------------------
    const PALETTE = {
      ol_intrinsic: 0x4fa3ff, ol_sensory: 0x2f6fbf, visual_projection: 0x6fd3ff,
      visual_centrifugal: 0x3fb0c0, cb_intrinsic: 0xffc857, cb_sensory: 0xff9f43,
      cb_motor: 0xff6b6b, cb_efferent: 0xff8e8e, descending_neuron: 0xff5da2,
      ascending_neuron: 0xc77dff, vnc_intrinsic: 0x7ee787, vnc_motor: 0xff7b72,
      vnc_sensory: 0x58d6a0, vnc_efferent: 0xa5d6a7,
    };
    const colourOf = (sc) => new THREE.Color(PALETTE[sc] ?? 0x9aa0a6);

    // --- scene ---------------------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08090c);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 100000);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // --- the point cloud -----------------------------------------------------------------------
    let n = 0, glow = null, points = null, lines = null, lineGlow = null, preOfLine = null;
    let map = null;

    const pointMaterial = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { size: { value: parseFloat(params.get("size") ?? "2.2") } },
      vertexShader: `
        attribute vec3 tint; attribute float glow; attribute float known;
        varying vec3 vTint; varying float vGlow; varying float vKnown;
        uniform float size;
        void main() {
          vTint = tint; vGlow = glow; vKnown = known;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = clamp(size * (1.0 + 1.5 * glow) * (600.0 / -mv.z), 1.5, 12.0);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying vec3 vTint; varying float vGlow; varying float vKnown;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float soft = 1.0 - smoothstep(0.2, 0.5, d);
          float base = vKnown > 0.5 ? 0.10 : 0.04;
          float g = min(vGlow, 1.0);
          vec3 c = vTint * (base + g * 0.55) + vec3(g * 0.12);
          gl_FragColor = vec4(c, soft * (0.25 + 0.35 * g));
        }`,
    });

    function buildBrain(m) {
      map = m;
      n = m.n;
      const pos = new Float32Array(n * 3);
      const tint = new Float32Array(n * 3);
      const known = new Float32Array(n);
      glow = new Float32Array(n);
      const counts = {};
      for (let i = 0; i < n; i++) {
        const p = m.positions ? m.positions[i] : [Math.random() * 500, Math.random() * 500, Math.random() * 500];
        pos[3 * i] = p[0]; pos[3 * i + 1] = p[1]; pos[3 * i + 2] = p[2];
        const sc = m.superclass ? m.superclass[i] : "";
        counts[sc] = (counts[sc] || 0) + 1;
        const c = colourOf(sc);
        tint[3 * i] = c.r; tint[3 * i + 1] = c.g; tint[3 * i + 2] = c.b;
        known[i] = m.known ? (m.known[i] ? 1 : 0) : 1;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("tint", new THREE.BufferAttribute(tint, 3));
      geo.setAttribute("known", new THREE.BufferAttribute(known, 1));
      geo.setAttribute("glow", new THREE.BufferAttribute(glow, 1).setUsage(THREE.DynamicDrawUsage));
      geo.computeBoundingSphere();
      points = new THREE.Points(geo, pointMaterial);
      scene.add(points);
      // frame the camera on the brain; the EM volume's y points down, so flip it
      points.rotation.x = Math.PI;
      const s = geo.boundingSphere;
      controls.target.set(s.center.x, -s.center.y, s.center.z);
      camera.position.set(s.center.x, -s.center.y, s.center.z + s.radius * 1.6);
      camera.near = s.radius / 100; camera.far = s.radius * 50; camera.updateProjectionMatrix();
      legend.innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 14)
        .map(([sc, k]) => `<span style="background:#${colourOf(sc).getHexString()}"></span>${sc || "unknown"} ${k}`)
        .join("<br>");
      if (artifactUrl && edgesPerNeuron > 0) loadEdges(pos).catch((e) => { hud.textContent += ` (no synapses: ${e.message})`; });
      return geo;
    }

    // --- synapses from the artifact's CSC brain --------------------------------------------
    async function fetchArray(ref) {
      const buf = await (await fetch(`${artifactUrl}/${ref.file}`)).arrayBuffer();
      return ref.dtype === "int64" ? new BigInt64Array(buf) : ref.dtype === "float32" ? new Float32Array(buf) : new Int32Array(buf);
    }
    async function loadEdges(pos) {
      const manifest = await (await fetch(`${artifactUrl}/manifest.json`)).json();
      const b = manifest.brain;
      if (b.weights_layout !== "csc") throw new Error("edges need a csc brain");
      const [indptr, indices, values] = await Promise.all([fetchArray(b.indptr), fetchArray(b.indices), fetchArray(b.values)]);
      const segs = [], pre = [];
      for (let j = 0; j < n; j++) {                       // the strongest outgoing synapses of j
        const lo = Number(indptr[j]), hi = Number(indptr[j + 1]);
        if (hi <= lo) continue;
        const order = [];
        for (let k = lo; k < hi; k++) order.push(k);
        order.sort((a, c) => Math.abs(values[c]) - Math.abs(values[a]));
        for (const k of order.slice(0, edgesPerNeuron)) {
          const i = Number(indices[k]);
          segs.push(pos[3 * j], pos[3 * j + 1], pos[3 * j + 2], pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]);
          pre.push(j);
        }
      }
      preOfLine = pre;
      lineGlow = new Float32Array(pre.length * 2);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(segs), 3));
      geo.setAttribute("glow", new THREE.BufferAttribute(lineGlow, 1).setUsage(THREE.DynamicDrawUsage));
      lines = new THREE.LineSegments(geo, new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        vertexShader: `attribute float glow; varying float vGlow;
          void main() { vGlow = glow; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `varying float vGlow;
          void main() { float g = vGlow * vGlow; gl_FragColor = vec4(0.5 + 0.5 * g, 0.6 + 0.4 * g, 1.0, 0.10 * g); }`,
      }));
      lines.rotation.x = Math.PI;
      scene.add(lines);
      hud.textContent += `; ${pre.length} synapses drawn`;
    }

    // --- activity in --------------------------------------------------------------------------
    let stepCount = 0, spikeCount = 0;
    function applyStep(step) {
      if (!glow) return;
      const idx = step.indices, cnt = step.counts;
      for (let k = 0; k < idx.length; k++) glow[idx[k]] = Math.min(1.5, glow[idx[k]] + 0.6 + 0.15 * (cnt ? cnt[k] : 1));
      if (lineGlow) {
        for (let e = 0; e < preOfLine.length; e++) {
          const g = glow[preOfLine[e]];
          if (g > 0.5) { lineGlow[2 * e] = Math.min(1, g); lineGlow[2 * e + 1] = Math.min(1, g) * 0.7; }
        }
      }
      stepCount++; spikeCount += idx.length;
    }

    let file = null, fileFps = 10, cursor = 0, lastTick = 0;
    if (wsUrl) {
      const ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        if (subscribe) { ws.send(JSON.stringify({ op: "positions" })); ws.send(JSON.stringify({ op: "activity", on: true })); }
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.positions !== undefined && msg.n) { buildBrain(msg); hud.textContent = `live: ${n} neurons from ${wsUrl}`; }
        else if (msg.indices) applyStep(msg);
      };
      ws.onclose = () => { hud.textContent += " (disconnected)"; };
      ws.onerror = () => { hud.textContent = `could not connect to ${wsUrl}`; };
    } else if (activityUrl) {
      file = await (await fetch(activityUrl)).json();
      fileFps = file.fps || 10;
      buildBrain(file);
      hud.textContent = `${n} neurons, ${file.steps.length} steps at ${fileFps} fps`;
    } else if (artifactUrl) {
      const manifest = await (await fetch(`${artifactUrl}/manifest.json`)).json();
      const nn = manifest.neurons;
      if (!nn || !nn.positions) { hud.textContent = "this artifact has no neuron positions"; }
      else {
        const pos = await fetchArray(nn.positions);
        const known = nn.positions_known ? new Uint8Array(await (await fetch(`${artifactUrl}/${nn.positions_known.file}`)).arrayBuffer()) : null;
        const ann = nn.annotations ? await (await fetch(`${artifactUrl}/${nn.annotations}`)).json() : null;
        const positions = [];
        for (let i = 0; i < manifest.brain.n_neurons; i++) positions.push([pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]]);
        buildBrain({ n: manifest.brain.n_neurons, positions, known: known ? Array.from(known, (v) => v === 1) : null,
                     superclass: ann ? ann.superclass : null });
        hud.textContent = `${n} neurons of ${manifest.name} (no activity source: add ?activity= or ?ws=)`;
      }
    } else {
      hud.textContent = "give ?activity=file.json, ?ws=ws://host:port or ?artifact=dir";
    }

    function frame(now) {
      if (file && now - lastTick >= 1000 / fileFps) {
        applyStep(file.steps[cursor]);
        cursor = (cursor + 1) % file.steps.length;
        lastTick = now;
      }
      if (glow) {
        for (let i = 0; i < n; i++) glow[i] *= decay;
        points.geometry.attributes.glow.needsUpdate = true;
        if (lineGlow) {
          for (let i = 0; i < lineGlow.length; i++) lineGlow[i] *= decay;
          lines.geometry.attributes.glow.needsUpdate = true;
        }
        if (stepCount && (stepCount % 10 === 0)) {
          const base = hud.textContent.split(" | ")[0];
          hud.textContent = `${base} | step ${stepCount}, ${(spikeCount / stepCount).toFixed(0)} neurons firing per step`;
        }
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
