# Tool configuration for the repository. The installable packages are core/ and training/.

[tool.ruff]
line-length = 100
extend-exclude = ["data", "runs", "videos", "artifacts", ".venv", "bindings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Sparse CSR tensor support is in beta:UserWarning",
    "ignore:Sparse invariant checks are implicitly disabled:UserWarning",
]

[tool.coverage.run]
source = ["neurofly_core", "neurofly_training"]
omit = ["*/rpc/neurofly_pb2*.py", "*/__main__.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
